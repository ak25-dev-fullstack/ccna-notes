<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CCNA Protocols & Addresses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one mindmap per topic, root on the left, branches fan right with drawn cable connectors; branch colours follow T568B pair colours */
:root{
  --bg:#eef0ee; --panel:#fbfbf9; --ink:#1b2125; --muted:#5d676d; --line:#cfd5d4; --mask:#d8dddc;
  --w-orange:#c0601a; --w-green:#2c8448; --w-blue:#2c60ad; --w-brown:#7a5232; --w-slate:#56636b;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131719; --panel:#1b2023; --ink:#e3e8e9; --muted:#97a3a8; --line:#2e3639; --mask:#2c3438;
  --w-orange:#f0934a; --w-green:#5cc07a; --w-blue:#78a4f0; --w-brown:#c4946f; --w-slate:#9aa8b0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --panel:#1b2023; --ink:#e3e8e9; --muted:#97a3a8; --line:#2e3639; --mask:#2c3438;
  --w-orange:#f0934a; --w-green:#5cc07a; --w-blue:#78a4f0; --w-brown:#c4946f; --w-slate:#9aa8b0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px}
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 64px}
header{display:grid;gap:14px;margin-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.02;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:500 13px var(--f-body);color:var(--muted);background:none;border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font:500 13px var(--f-body);color:var(--ink);text-decoration:none;padding:5px 9px;border-radius:5px;border:1px solid var(--line)}
.jump a:hover{background:var(--panel)}
button:focus-visible,a:focus-visible{outline:2px solid var(--w-blue);outline-offset:2px}

section.topic{margin-top:40px;scroll-margin-top:72px}
.topic h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0 0 4px}
.topic .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.map{position:relative;display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr);column-gap:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
.map svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.root{align-self:center;background:var(--ink);color:var(--bg);border-radius:8px;padding:14px 16px;position:relative;z-index:1}
.root b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.root span{font-family:var(--f-mono);font-size:11px;opacity:.75}
.branches{display:grid;gap:22px}
.branch{display:grid;grid-template-columns:minmax(120px,168px) minmax(0,1fr);column-gap:40px;align-items:center}
.blabel{position:relative;z-index:1;font:600 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--panel));border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.blabel i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.leaves{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.leaf{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;color:inherit;cursor:default}
.k{font-family:var(--f-mono);font-weight:600;font-size:13.5px;color:var(--c);min-width:0;overflow-wrap:anywhere}
.v{font-size:14px;min-width:0;overflow-wrap:anywhere}
.k,.v{border-radius:3px;transition:background .15s,color .15s}

[data-hide] .leaf{cursor:pointer}
[data-hide] .leaf:hover{border-color:var(--c)}
[data-hide="v"] .leaf:not(.open) .v,[data-hide="k"] .leaf:not(.open) .k{color:transparent;background:var(--mask);user-select:none}
.tally{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .map{display:block;padding:16px}
  .map svg{display:none}
  .root{display:inline-block;margin-bottom:14px}
  .branches{border-left:2px solid var(--line);margin-left:12px;padding-left:0;gap:18px}
  .branch{display:block;position:relative;padding-left:18px}
  .branch::before{content:"";position:absolute;left:0;top:17px;width:14px;border-top:2px solid var(--line)}
  .blabel{display:inline-flex;margin-bottom:8px}
  .leaves{border-left:2px solid color-mix(in srgb,var(--c) 50%,var(--panel));padding-left:10px;margin-left:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">From your CCNA deck</div>
    <h1>CCNA Protocols &amp; Addresses</h1>
    <p class="lede">Every protocol name, standard number, port and address card from your flashcards, grouped into seven mindmaps. Switch to a quiz mode to cover one side, then tap a card to check yourself.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Study mode">
      <button id="m-all" data-mode="" aria-pressed="true">Show all</button>
      <button id="m-v" data-mode="v" aria-pressed="false">Hide answers</button>
      <button id="m-k" data-mode="k" aria-pressed="false">Hide names</button>
    </div>
    <span class="tally" id="tally"></span>
    <nav class="jump" id="jump" aria-label="Jump to map"></nav>
  </div>

  <main id="maps"></main>
</div>

<script>
const C = {o:'var(--w-orange)', g:'var(--w-green)', b:'var(--w-blue)', n:'var(--w-brown)', s:'var(--w-slate)'};
const MAPS = [
 {id:'ieee', title:'IEEE & Layer 2 standards', root:'L1/L2 standards', sub:'Ethernet, trunking, spanning tree and EtherChannel names and standard numbers.', branches:[
  {n:'Copper Ethernet', c:'o', l:[['802.3','Original Ethernet standard (1983)'],['802.3i','10BASE-T · 10 Mbps'],['802.3u','100BASE-T · 100 Mbps (FastEthernet)'],['802.3ab','1000BASE-T · 1 Gbps'],['802.3an','10GBASE-T · 10 Gbps']]},
  {n:'Fiber Ethernet', c:'g', l:[['802.3z','1000BASE-LX · 550 m multimode / 5 km single-mode'],['802.3ae','10GBASE-SR 400 m · LR 10 km · ER 30 km'],['SFP','Small Form-Factor Pluggable transceiver']]},
  {n:'VLAN trunking', c:'b', l:[['802.1Q (dot1q)','Industry standard · 4-byte tag after source MAC'],['ISL','Inter-Switch Link · Cisco proprietary · favoured by DTP'],['DTP','Dynamic Trunking Protocol · Cisco · auto / desirable'],['VTP','VLAN Trunking Protocol · v1, v2, v3 · server/client/transparent']]},
  {n:'Spanning tree', c:'n', l:[['802.1D','Classic STP'],['802.1w','Rapid STP (RSTP)'],['802.1s','Multiple STP (MSTP)'],['PVST+','Cisco upgrade to 802.1D (per-VLAN)'],['Rapid PVST+','Cisco upgrade to 802.1w'],['BPDU','Bridge Protocol Data Unit']]},
  {n:'EtherChannel', c:'s', l:[['802.3ad','LACP · industry standard · active / passive'],['PAgP','Port Aggregation Protocol · Cisco · desirable / auto'],['Static','channel-group mode on'],['LAG','Link Aggregation Group']]}
 ]},
 {id:'routing', title:'Routing & gateway redundancy', root:'Routing protocols', sub:'Protocol families, full names and versions.', branches:[
  {n:'IGP · distance vector', c:'o', l:[['RIP','Routing Information Protocol · hop count, max 15'],['EIGRP','Enhanced Interior Gateway Routing Protocol · bandwidth + delay']]},
  {n:'IGP · link state', c:'g', l:[['OSPF','Open Shortest Path First · cost from bandwidth'],['IS-IS','Intermediate System to Intermediate System · default cost 10']]},
  {n:'EGP · path vector', c:'b', l:[['BGP','Border Gateway Protocol']]},
  {n:'Versions', c:'n', l:[['RIPv1','IPv4 · classful · broadcast'],['RIPv2','IPv4 · VLSM/CIDR · multicast 224.0.0.9'],['RIPng','IPv6 (RIP next generation)'],['OSPFv2','IPv4'],['OSPFv3','IPv6']]},
  {n:'FHRPs', c:'s', l:[['HSRP','Hot Standby Router Protocol · Cisco · active / standby'],['VRRP','Virtual Router Redundancy Protocol · open standard · master / backup'],['GLBP','Gateway Load Balancing Protocol · Cisco · 1 AVG + up to 4 AVFs']]}
 ]},
 {id:'ports', title:'Port numbers', root:'Layer 4 ports', sub:'Well-known ports by transport protocol, plus the IANA ranges.', branches:[
  {n:'TCP', c:'o', l:[['20','FTP data'],['21','FTP control'],['22','SSH'],['23','Telnet'],['25','SMTP'],['80','HTTP'],['110','POP3'],['443','HTTPS']]},
  {n:'UDP', c:'g', l:[['67','DHCP server'],['68','DHCP client'],['69','TFTP'],['161','SNMP agent'],['162','SNMP manager'],['514','Syslog']]},
  {n:'TCP + UDP', c:'b', l:[['53','DNS']]},
  {n:'IANA ranges', c:'n', l:[['0 – 1023','Well-known'],['1024 – 49151','Registered'],['49152 – 65535','Ephemeral (random source ports)']]}
 ]},
 {id:'codes', title:'Protocol numbers & type codes', root:'Header codes', sub:'The numbers that name the next protocol inside a frame or packet.', branches:[
  {n:'IPv4 Protocol field', c:'o', l:[['1','ICMP'],['6','TCP'],['17','UDP'],['88','EIGRP'],['89','OSPF']]},
  {n:'EtherType', c:'g', l:[['0x0800','IPv4'],['0x86DD','IPv6'],['0x0806','ARP'],['0x8100','802.1Q TPID (tagged frame)']]},
  {n:'ICMPv6 / NDP', c:'b', l:[['133','RS · Router Solicitation'],['134','RA · Router Advertisement'],['135','NS · Neighbor Solicitation'],['136','NA · Neighbor Advertisement']]},
  {n:'Type/Length rule', c:'n', l:[['≤ 1500','Field means Length'],['≥ 1536','Field means Type']]}
 ]},
 {id:'ipv4', title:'IPv4 addresses', root:'IPv4 · 32 bits', sub:'Classes, special addresses, multicast groups and prefix masks.', branches:[
  {n:'Classes', c:'o', l:[['A','0–127 · /8 · 0xxxxxxx'],['B','128–191 · /16 · 10xxxxxx'],['C','192–223 · /24 · 110xxxxx'],['D','224–239 · multicast · 1110xxxx'],['E','240–255 · experimental · 1111xxxx']]},
  {n:'Special', c:'g', l:[['127.x.x.x','Loopback (tests local stack)'],['Host bits all 0s','Network address'],['Host bits all 1s','Broadcast address'],['0.0.0.0/0','Default route'],['/32','Host route · local (L) routes']]},
  {n:'Multicast groups', c:'b', l:[['224.0.0.1','All nodes'],['224.0.0.2','All routers · HSRPv1'],['224.0.0.5','All OSPF routers (Hellos)'],['224.0.0.6','OSPF DR / BDR'],['224.0.0.9','RIPv2'],['224.0.0.10','EIGRP'],['224.0.0.18','VRRP'],['224.0.0.102','HSRPv2 · GLBP']]},
  {n:'Prefix ↔ mask', c:'n', l:[['/8 · /16 · /24','255.0.0.0 · 255.255.0.0 · 255.255.255.0'],['/25','255.255.255.128'],['/26','255.255.255.192'],['/27','255.255.255.224'],['/28','255.255.255.240'],['/29','255.255.255.248'],['/30','255.255.255.252'],['/31','255.255.255.254'],['/32','255.255.255.255']]}
 ]},
 {id:'ipv6', title:'IPv6 addresses', root:'IPv6 · 128 bits', sub:'Address blocks, multicast groups and scopes, NDP targets and how addresses are built.', branches:[
  {n:'Address types', c:'o', l:[['2000::/3','Global unicast (like public IPv4)'],['FC00::/7 · FD…','Unique local (like private IPv4)'],['FE80::/10','Link-local · interface ID by EUI-64'],['FF00::/8','Multicast'],['::','Unspecified'],['::1','Loopback'],['anycast','One-to-one-of-many · ipv6 address … anycast']]},
  {n:'Multicast groups', c:'g', l:[['FF02::1','All nodes'],['FF02::2','All routers'],['FF02::5','All OSPF routers'],['FF02::6','OSPF DR / BDR'],['FF02::9','RIP routers'],['FF02::A','EIGRP routers']]},
  {n:'Multicast scope', c:'b', l:[['FF01','Interface-local'],['FF02','Link-local'],['FF05','Site-local'],['FF08','Organization-local'],['FF0E','Global']]},
  {n:'NDP targets', c:'n', l:[['RS →','FF02::2 (all routers)'],['RA →','FF02::1 (all nodes)'],['NS (find MAC) →','Neighbour’s solicited-node address'],['DAD NS →','Its own solicited-node address'],['Solicited-node','ff02::1:ff + last 6 hex digits']]},
  {n:'Structure & sizes', c:'s', l:[['Notation','8 hex quartets · drop leading 0s · :: once'],['/48','Typical enterprise allocation'],['/64','Typical subnet'],['Global unicast','48-bit routing prefix + 16-bit subnet + 64-bit interface ID'],['Unique local','FD + 40-bit global ID + subnet + interface ID'],['EUI-64','Split MAC · insert FFFE · invert 7th bit']]},
  {n:'RIRs', c:'o', l:[['AFRINIC','Africa'],['APNIC','Asia-Pacific'],['ARIN','US, Canada, some Caribbean & N. Atlantic islands'],['LACNIC','Latin America & Caribbean'],['RIPE NCC','Europe, Middle East, parts of Central Asia']]}
 ]},
 {id:'mac', title:'MAC & Layer 2 addresses', root:'MAC · 48 bits', sub:'MAC format, special destinations and the virtual MACs used by FHRPs.', branches:[
  {n:'Format', c:'o', l:[['6 bytes / 48 bits','Written as 12 hex characters'],['OUI','First 3 bytes · Organizationally Unique Identifier'],['BIA','Burned-In Address (another name for MAC)']]},
  {n:'U/L bit (7th)', c:'g', l:[['0','UAA · Universally Administered'],['1','LAA · Locally Administered']]},
  {n:'Special destinations', c:'b', l:[['FFFF.FFFF.FFFF','Broadcast (ARP Request)'],['0100.0ccc.cccd','PVST+ BPDUs'],['0180.c200.0000','Standard STP BPDUs']]},
  {n:'FHRP virtual MACs', c:'n', l:[['0000.0c07.acXX','HSRPv1 · XX = group'],['0000.0c9f.fXXX','HSRPv2 · XXX = group'],['0000.5e00.01XX','VRRP · XX = group'],['0007.b400.XXYY','GLBP · XX = group, YY = AVF']]}
 ]}
];

const SHORT={ieee:'Standards',routing:'Routing',ports:'Ports',codes:'Type codes',ipv4:'IPv4',ipv6:'IPv6',mac:'MAC'};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mapsEl = document.getElementById('maps'), jump = document.getElementById('jump');
let total = 0;
MAPS.forEach(m => {
  const count = m.branches.reduce((a,b)=>a+b.l.length,0); total += count;
  jump.insertAdjacentHTML('beforeend', `<a href="#${m.id}">${esc(SHORT[m.id])}</a>`);
  mapsEl.insertAdjacentHTML('beforeend', `
  <section class="topic" id="${m.id}">
    <h2>${esc(m.title)}</h2><p class="sub">${esc(m.sub)}</p>
    <div class="map">
      <svg aria-hidden="true"></svg>
      <div class="root"><b>${esc(m.root)}</b><span>${count} cards</span></div>
      <div class="branches">${m.branches.map(b=>`
        <div class="branch" style="--c:${C[b.c]}">
          <div class="blabel"><i></i>${esc(b.n)}</div>
          <ul class="leaves">${b.l.map(([k,v])=>`<li><button class="leaf" type="button"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></button></li>`).join('')}</ul>
        </div>`).join('')}
      </div>
    </div>
  </section>`);
});
document.getElementById('tally').textContent = total + ' cards';

function curve(a,b){const dx=Math.max(16,(b.x-a.x)*.55);return `M${a.x} ${a.y}C${a.x+dx} ${a.y} ${b.x-dx} ${b.y} ${b.x} ${b.y}`}
function draw(){
  document.querySelectorAll('.map').forEach(map=>{
    const svg = map.querySelector('svg');
    if (getComputedStyle(svg).display==='none') return;
    const mr = map.getBoundingClientRect();
    const R = el=>{const r=el.getBoundingClientRect();return {x:r.right-mr.left,y:r.top+r.height/2-mr.top}};
    const L = el=>{const r=el.getBoundingClientRect();return {x:r.left-mr.left,y:r.top+r.height/2-mr.top}};
    svg.setAttribute('width',map.offsetWidth); svg.setAttribute('height',map.offsetHeight);
    svg.setAttribute('viewBox',`0 0 ${map.offsetWidth} ${map.offsetHeight}`);
    const root = R(map.querySelector('.root'));
    let out='';
    map.querySelectorAll('.branch').forEach(br=>{
      const col = br.style.getPropertyValue('--c'), lab = br.querySelector('.blabel');
      out += `<path d="${curve(root,L(lab))}" fill="none" stroke="${col}" stroke-width="2.25" stroke-linecap="round"/>`;
      const s = R(lab);
      br.querySelectorAll('.leaf').forEach(lf=>{
        out += `<path d="${curve(s,L(lf))}" fill="none" stroke="${col}" stroke-opacity=".55" stroke-width="1.4"/>`;
      });
    });
    svg.innerHTML = out;
  });
}
new ResizeObserver(()=>requestAnimationFrame(draw)).observe(document.body);
if (document.fonts) document.fonts.ready.then(draw);
draw();

const wrap = document.querySelector('.wrap');
document.querySelectorAll('.seg button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b===btn));
  document.querySelectorAll('.leaf.open').forEach(l=>l.classList.remove('open'));
  if (btn.dataset.mode) wrap.dataset.hide = btn.dataset.mode; else delete wrap.dataset.hide;
}));
mapsEl.addEventListener('click',e=>{
  const lf = e.target.closest('.leaf');
  if (lf && wrap.dataset.hide) lf.classList.toggle('open');
});
</script>

</body></html>
